name: Daily NSE Download and Process

on:
  schedule:
    - cron: '15 12 * * 1-5' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pdfplumber

      - name: Run Downloader (Site A)
        run: python nse_pdf_downloader.py

      - name: Run Bridge (PDF to JSON)
        run: python processor.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add NSE_Daily_Reports/*.pdf || true
          git add NSE_Daily_JSON/*.json || true
          git commit -m "Auto-update: PDF and JSON data $(date)" || echo "No changes"
          git push
