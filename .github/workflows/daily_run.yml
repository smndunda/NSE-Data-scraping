name: Daily NSE HTML Scraper

on:
  schedule:
    - cron: '15 12 * * 1-5' # 3:15 PM Nairobi time
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests pandas lxml html5lib

      - name: Run Market Scraper
        run: python market_scraper.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add NSE_Daily_JSON/*.json
          git commit -m "Auto-update market JSON $(date)" || echo "No changes"
          git push
