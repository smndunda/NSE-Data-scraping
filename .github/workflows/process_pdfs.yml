name: Convert PDFs to JSON

on:
  workflow_dispatch: # This allows you to run it manually with a button
  push:
    paths:
      - 'NSE_Daily_Reports/**' # Runs automatically if you upload a new PDF

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Important: allows the bot to save JSONs back to your repo

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pdfplumber pandas

      - name: Run Extraction Script
        run: python batch_extract.py

      - name: Commit and Push JSON files
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add NSE_Daily_JSON/*.json
          # Only commit if there are changes to avoid errors
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-extracted JSON tables from PDF"
          git push
