name: Convert PDFs to JSON
on:
  workflow_dispatch: # Allows manual run
  push:
    paths:
      - 'NSE_Daily_Reports/**'

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install pdfplumber pandas
      - name: Run Extraction
        run: python batch_extract.py
      - name: Push results
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          git add NSE_Daily_JSON/*.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Updated JSON tables"
          git push
